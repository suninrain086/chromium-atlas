name: sync-docs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'chromium/src ref to sync (branch or sha)'
        required: false
        default: 'main'

concurrency:
  group: sync-docs
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync chromium docs and build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache chromium sparse clone
        uses: actions/cache@v4
        with:
          path: .cache/chromium
          key: chromium-cache-${{ inputs.ref || 'main' }}-v1
          restore-keys: |
            chromium-cache-${{ inputs.ref || 'main' }}-
            chromium-cache-

      - name: Install dependencies
        run: npm ci

      - name: Sync chromium docs (sparse clone)
        run: node scripts/sync-chromium.mjs --ref ${{ inputs.ref || 'main' }}

      - name: Scan real docs into JSON indexes
        run: npx tsx scripts/scan-docs.ts --source real

      - name: Build site
        run: npx vite build
        env:
          BASE_PATH: /chromium-atlas/

      - name: Check bundle budget
        run: node scripts/check-budget.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'sync-failure: hourly chromium docs sync failed';
            const body = `Sync workflow failed at ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure'],
              });
            }
